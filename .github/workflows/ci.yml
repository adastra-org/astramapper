name: CI

# No remote is wired yet, so nothing runs this today. It is committed so the
# checks are defined in one place and reviewable, and so adding a runner later
# is a one-line change to `runs-on`.
#
# Tauri cannot cross-compile: each OS must build on a runner of that OS. When
# more targets are needed, add matrix entries with their own runner labels
# rather than trying to produce them all from one machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned on purpose. With `@stable` alone the runner silently floats to
      # whatever stable is current, so a clippy release that adds a lint fails
      # PRs that touch no Rust at all. Bump the version deliberately.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # `chunks_exact_to_as_chunks` (new in clippy 1.99) fires ~40 times across
      # cw-core's byte parsers, all of it code that predates the lint. Porting
      # those loops to `as_chunks` is its own refactor: until it lands the lint
      # is allowed here rather than left failing every PR.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::chunks_exact_to_as_chunks

      # cw-core's round-trip tests that need a real GTA V install are marked
      # #[ignore], so this stays green on a machine without the game.
      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bunx oxlint .

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
