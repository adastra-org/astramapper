[workspace]
resolver = "2"
members = ["crates/cw-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/adastra-org/AstraMapper"

[workspace.dependencies]
# Binary format parsing. Every GTA V struct is little-endian and packed.
binrw = "0.15"
# Replaces SharpDX.Mathematics. f32 throughout, never widened in serialized layouts.
glam = "0.33"
# GTA5Keys locates the AES/NG keys inside GTA5.exe by SHA-1 hash search.
sha1 = "0.11"
# RPF binary entries and RSC7 resource payloads are raw deflate.
flate2 = "1.1"
# Mesh buffers cross the IPC boundary as base64 rather than JSON number arrays.
base64 = "0.22"
# BC1-BC7 block decoding. DDSIO.cs has its own, but stops short of BC7 and
# interpolates in the wrong domain; this is the reference bcdec implementation.
bcdec_rs = "0.2"
# Decoded textures cross the IPC boundary as PNG, not as 16 MB of raw RGBA.
png = "0.18"
thiserror = "2.0"
rayon = "1.12"
# Archives are read from thousands of times per session. Mapping one beats
# reopening and seeking it per extraction.
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test-only: comparing extracted payloads against hashes the C# reference emits.
sha2 = "0.11"

[profile.dev]
# Parsing 120 GB of archives is unusable at opt-level 0. Keep our own code
# debuggable but build dependencies optimized.
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
