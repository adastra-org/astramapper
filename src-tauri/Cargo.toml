[package]
name = "astramapper"
description = "GTA V modding tool. A port of CodeWalker to Tauri."
authors = ["Facundo"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "astramapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cw-core = { path = "../crates/cw-core" }
cw-cache = { path = "../crates/cw-cache" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
# The explorer gate drives cw-core directly to build a manager to list.
cw-core = { path = "../crates/cw-core" }

